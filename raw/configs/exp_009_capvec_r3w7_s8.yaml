# Exp-006a — Channel Asymmetry Test (Persona-Cap Proxy)
#
# Purpose:
#   Stress-test the channel model by keeping both channels active while making
#   authority ceilings asymmetric across likely channel owners.
#
# Design:
#   - reversibility remains ON (both channels present)
#   - persona-specific caps:
#       forward-capable founders / fast_movers -> W=8.0
#       likely reversion owners (peripheral / skeptical) -> W=3.0
#
# Prediction:
#   If channel structure still governs attractor multiplicity, k=2 should
#   persist, but with asymmetric authority levels (forward role > reversion role).
#
# Falsification:
#   Collapse toward k=1-like endpoint despite active reversibility.

experiment:
  successor_selection: archived_first  # INT-173: required, no engine default
  id: exp_009_capvec_r3w7
  seed: 8
  description: >
    Batch 06 falsification test A. Keep forward and reversion channels active,
    but impose asymmetric persona-specific authority caps to test whether
    attractor multiplicity survives channel imbalance.
  ticks: 5000
  record_interval: 50

node_groups:
  - persona: founding_node
    count: 8
    id_prefix: "fn_"

  - persona: peripheral_node
    count: 52
    id_prefix: "pn_"

  - persona: mediating_node
    count: 20
    id_prefix: "mn_"

  - persona: skeptical_peer
    count: 12
    id_prefix: "sp_"

  - persona: fast_mover
    count: 8
    id_prefix: "fm_"

claim_groups:
  - id_prefix: "cl_easy_true_"
    count: 12
    initial_state: unknown
    ground_truth: true
    difficulty: 0.2
    ambiguity: 0.2

  - id_prefix: "cl_easy_false_"
    count: 20
    initial_state: unknown
    ground_truth: false
    difficulty: 0.2
    ambiguity: 0.2

  - id_prefix: "cl_med_true_"
    count: 14
    initial_state: unknown
    ground_truth: true
    difficulty: 0.5
    ambiguity: 0.5

  - id_prefix: "cl_med_false_"
    count: 20
    initial_state: unknown
    ground_truth: false
    difficulty: 0.5
    ambiguity: 0.5

  - id_prefix: "cl_hard_true_"
    count: 9
    initial_state: unknown
    ground_truth: true
    difficulty: 0.8
    ambiguity: 0.7

  - id_prefix: "cl_hard_false_"
    count: 25
    initial_state: unknown
    ground_truth: false
    difficulty: 0.8
    ambiguity: 0.7

network:
  topology: small_world
  k: 6
  p: 0.1

primitives:
  boundary: true
  lineage:
    enabled: true
    retention_probability: 1.0
  authority: true
  mediation:
    enabled: true
    mode: structured
  confidence:
    enabled: true
    threshold_mean: 0.5
    threshold_variance: 0.1
  reversibility: true
  observation:
    enabled: false

trust_network:
  dynamic: false
  update_rule: null
  initial_weights: uniform

dynamics:
  revisability_rate: 0.005
  min_ticks_before_archive: 100
  stability_window_fraction: 0.025
  weight_cap: 5.0
  weight_cap_by_persona:
    founding_node: 7.0
    fast_mover: 7.0
    peripheral_node: 3.0
    skeptical_peer: 3.0

events: []

hypotheses:
  - id: H1_heterogeneous_cap_closed_form
    description: >
      Endpoint Gini equals the two-dominant heterogeneous-cap closed form for
      caps (reversion=3.0, forward=7.0) at N=100, w0=1.0: 197/2700 = 0.072962962963.
      Falsified if the endpoint deviates beyond floating-point tolerance.
    metric: authority_concentration_gini
    predicted_direction: flat
    window: [4000, 5000]
